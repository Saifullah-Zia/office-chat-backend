# ==========================================
# Every deploy-specific value comes from an environment variable.
# The value after ":" is the LOCAL DEVELOPMENT default; production (Railway) must set its own.
# Secrets have no default here: on your computer they come from local-secrets.properties
# (never committed; see local-secrets.example.properties), on Railway from its Variables.
# See DEPLOY-RAILWAY.md.
# ==========================================
spring.application.name=office-chat-backend
spring.config.import=optional:file:./local-secrets.properties

# API explorer (/swagger-ui): off unless API_DOCS_ENABLED=true (turned on in local-secrets.properties)
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# ==========================================
# PostgreSQL (Railway: reference the Postgres service's PG* variables)
# ==========================================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:office_chat}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Load lazy relations (senders, members, users) in groups instead of one query each
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Security
# ==========================================
# Production: a long random value (64+ characters). Changing it signs everyone out.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# The website address(es) allowed to call this API, comma-separated (e.g. https://chat.yourcompany.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==========================================
# Server (Railway sets PORT)
# ==========================================
server.port=${PORT:8080}
# Sized for a team of 20–40 (defaults are for big sites and keep more memory busy):
# request workers, and database connections (Postgres also uses memory per connection).
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=4
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
# Behind Railway's HTTPS proxy: trust X-Forwarded-* so redirects and client IPs are right
server.forward-headers-strategy=framework

# ==========================================
# Files (Railway: point these at the mounted volume, e.g. /data/...)
# ==========================================
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ==========================================
# Web Push (keys are generated once into this file; keep it on the volume)
# ==========================================
app.push.vapid-key-file=${VAPID_KEY_FILE:vapid-keys.properties}
app.push.subject=${PUSH_SUBJECT:mailto:info@jcatsolutions.com}
# Android app push (Firebase Cloud Messaging): the service-account key JSON, base64-encoded. Off if empty.
app.fcm.service-account=${FIREBASE_SERVICE_ACCOUNT:}
# ==========================================
# Agora RTC (calls)
# ==========================================
agora.app.id=${AGORA_APP_ID:79e95203a8e64d3ba8cfe9c314b77cef}
agora.app.certificate=${AGORA_APP_CERTIFICATE:}
# ==========================================
# AI (optional): translation and chat summaries are off unless ANTHROPIC_API_KEY is set
# ==========================================

# ==========================================
# Email (Resend): "Forgot password?" links. Off unless RESEND_API_KEY is set.
# ==========================================
app.mail.resend-api-key=${RESEND_API_KEY:}
# Must use a domain verified in Resend, e.g. Office Chat <no-reply@jcatsolutions.com>
app.mail.from=${MAIL_FROM:}
# The chat app's address, used in emailed links
app.frontend-url=${APP_URL:http://localhost:3000}

# Application
# ==========================================
spring.application.name=office-chat-backend

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/office_chat
spring.datasource.username=postgres
spring.datasource.password=12345

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Load lazy relations (senders, members, users) in groups instead of one query each
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# ==========================================
jwt.secret=8f3a9d7c2b1e6f4a9c8d7e2b5a1f6c3d9e8b7a4c2f1d6e9a3b8c5d2f7e4a1
jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:3000

# ==========================================
# Server
# ==========================================
server.port=8080

# File storage
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ==========================================
# Agora RTC
# ==========================================
agora.app.id=79e95203a8e64d3ba8cfe9c314b77cef
agora.app.certificate=2ddcf8aaf4624798836073d4bd21de00